# Single-binary Loki on local disk. Enough for one machine's event log.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The event log is replayed from the start of the file on first run, so lines
  # are older than Loki's default acceptance window. Both of these have to be
  # wide enough to take them or the backfill is silently rejected.
  reject_old_samples: false
  reject_old_samples_max_age: 8760h
  volume_enabled: true

# Keep a year. The file is small and the whole point is cost history.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
