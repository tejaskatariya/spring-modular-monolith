# Local trace backend for Juno. Start it with:
#   docker compose -f observability/compose.yml up -d
#
# Juno runs on the host and posts spans to http://localhost:4318, which Tempo
# publishes below. Grafana reads them back from Tempo over the compose network.
# Neither container reaches into the repository; nothing here writes to your
# working tree.

name: juno-observability

services:
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # OTLP/HTTP receiver. This is the one Juno posts to, and the only port
      # here that needs to be reachable from the host.
      - "127.0.0.1:4318:4318"
      # Tempo's own API and UI-less query endpoint. Published for curl and
      # for checking readiness; Grafana does not use this published port.
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Tails .juno/logs/pipeline.jsonl into Loki. The repository is mounted
  # read-only; nothing here can write to your working tree.
  alloy:
    image: grafana/alloy:v1.11.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./alloy.river:/etc/alloy/config.alloy:ro
      - ../.juno/logs:/juno-logs:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Local-only stack, so the login screen is skipped and every visitor is
      # an admin. Do not copy this to anything reachable off this machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # TraceQL query editor and the trace waterfall improvements.
      GF_FEATURE_TOGGLES_ENABLE: traceQLStreaming
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  tempo-data:
  grafana-data:
  loki-data:
  alloy-data:
